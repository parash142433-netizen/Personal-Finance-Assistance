name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # allows manual trigger from GitHub UI

permissions:
  contents: write      # needed to push to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install dependencies
      - name: Install Python dependencies
        run: pip install openpyxl

      # 4. Inject latest data into app.js
      - name: Inject finance data into app.js
        run: python execution/inject_data.py

      # 5. Bundle into standalone mobile HTML
      - name: Bundle ledgr-mobile.html
        run: python execution/bundle_standalone_html.py

      # 6. Deploy to GitHub Pages (gh-pages branch)
      #    Only index.html, styles.css, app.js, ledgr-mobile.html, and data/
      #    are deployed. Source code (execution/, directives/, etc.) stays private.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          # Only publish the files the web app needs
          exclude_assets: |
            .github/**
            execution/**
            directives/**
            scripts/**
            cloudflare/**
            .vscode/**
            .tmp/**
            .env*
            *.md
            *.xlsx
            *.txt
            *.py
            requirements.txt
          force_orphan: false
          commit_message: "Deploy: ${{ github.event.head_commit.message }}"
