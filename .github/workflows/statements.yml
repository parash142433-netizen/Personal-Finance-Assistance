name: Statements sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "One-time: read the 2021-2026 bank history and Jun/Jul card statements"
        type: boolean
        default: false

permissions:
  contents: write  # save the dashboard data file to the repo
  actions: write   # start the site build (Build and Deploy)

concurrency:
  group: statements-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pypdf

      - name: Sync statements to Cloudflare KV
        run: python execution/statements_sync.py
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          MTB_PDF_PASSWORD: ${{ secrets.MTB_PDF_PASSWORD }}
          EBL_PDF_PASSWORD: ${{ secrets.EBL_PDF_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKFILL: ${{ inputs.backfill && '1' || '0' }}
